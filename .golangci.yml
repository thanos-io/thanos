version: "2"
run:
  build-tags:
    - slicelabels
  issues-exit-code: 1
linters:
  enable:
    - goconst
    - godot
    - misspell
    - promlinter
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - (github.com/go-kit/log.Logger).Log
        - fmt.Fprintln
        - fmt.Fprint
    goconst:
      min-occurrences: 5
      ignore-tests: true
      exclude-types:
        - Call
        - CompositeLit
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - promlinter
        path: _test\.go
      - linters:
          - unused
        text: SourceStoreAPI.implementsStoreAPI
      - linters:
          - unused
        text: SourceStoreAPI.producesBlocks
      - linters:
          - unused
        text: Source.producesBlocks
      - linters:
          - unused
        text: newMockAlertmanager
      - linters:
          - unused
        text: ruleAndAssert
      - linters:
          - staticcheck
        text: 'labels.MetricName is deprecated: .*'  
      # x/net v0.60+ deprecates its HTTP/2 transport in favour of net/http's Protocols; moving to it changes
      # transport behaviour, so it is left for a follow-up.
      - linters:
          - staticcheck
        text: 'golang.org/x/net/http2\.(Transport|ConfigureTransport).* is deprecated'
      # google.golang.org/api deprecates WithCredentialsFile; its replacement needs the credential type, a
      # behaviour change for users, so it is left for a follow-up.
      - linters:
          - staticcheck
        text: 'google.golang.org/api/option.WithCredentialsFile is deprecated'
    paths:
      - vendor
      - internal/cortex
      - .bingo
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - vendor
      - internal/cortex
      - .bingo
      - third_party$
      - builtin$
      - examples$
