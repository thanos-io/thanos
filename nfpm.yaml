# yaml-language-server: https://nfpm.goreleaser.com/static/schema.json
name: "thanos"
arch: "${PKG_ARCH}"
platform: "linux"
# The full version string (including release number) is in the VERSION file.
# If you're making a new release update only that file.
version: "${PKG_VERSION}"
version_schema: none
section: "default"
priority: "extra"
maintainer: "Observability <obs@cloudflare.com>"
description: |
  The thanos monitoring system.
homepage: "https://github.com/thanos-io/thanos"
license: "Apache-2.0"

contents:
  - src: "output/thanos"
    dst: "/usr/bin/thanos"
